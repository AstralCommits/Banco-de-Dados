# Banco MySQL do TRAMA para desenvolvimento local.
# Na primeira subida (volume vazio) o MySQL roda database/banco_completo.sql,
# que cria as tabelas, procedures, triggers, indices e os dados de exemplo.
# Credenciais apenas para desenvolvimento: nao use em producao.

services:
  mysql:
    image: mysql:8.0
    container_name: trama-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: confeccoes
      MYSQL_USER: trama
      MYSQL_PASSWORD: trama
      TZ: America/Recife
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Porta no seu computador: 3307 por padrao, para nao brigar com um MySQL ja instalado na 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./database/banco_completo.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Usa TCP (127.0.0.1) e consulta uma tabela: so fica healthy depois que o init.sql terminou,
      # porque durante a carga inicial o MySQL roda sem rede
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-utrama", "-ptrama", "-e", "SELECT 1 FROM confeccoes.lancamento_mensal LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
